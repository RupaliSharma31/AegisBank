spring.application.name=ledger-service
spring.datasource.url=jdbc:mysql://localhost:3307/ledger_db
spring.datasource.username=ledger_app
spring.datasource.password=ledgerpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.url=jdbc:mysql://localhost:3307/ledger_db
spring.flyway.user=ledger_app
spring.flyway.password=ledgerpass