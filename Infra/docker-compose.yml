services:
  mysql:
    image: mysql:8.4
    container_name: aegis-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ledger_db
      MYSQL_USER: ledger_app
      MYSQL_PASSWORD: ledgerpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: